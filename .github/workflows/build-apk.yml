name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [spd-modificado]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Accept Android licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Usar siempre la misma llave de firma (permite actualizar sin perder partidas)
        run: |
          mkdir -p ~/.android
          cp .github/debug.keystore ~/.android/debug.keystore
      - name: Build debug APK
        run: ./gradlew android:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: ShatteredPixelDungeon-modificado
          path: android/build/outputs/apk/debug/*.apk
      - name: Mostrar huella de la firma
        run: keytool -printcert -jarfile android/build/outputs/apk/debug/*.apk | grep SHA256
