name: Build RPG APK
on:
  push:
    branches: [rpg-aldea]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Instalar Godot y plantillas
        run: |
          V=4.3-stable
          B=https://github.com/godotengine/godot-builds/releases/download/$V
          curl -sSL -o godot.zip $B/Godot_v${V}_linux.x86_64.zip
          curl -sSL -o tpl.tpz $B/Godot_v${V}_export_templates.tpz
          unzip -q godot.zip && mv Godot_v${V}_linux.x86_64 godot && chmod +x godot
          mkdir -p ~/.local/share/godot/export_templates/4.3.stable
          unzip -q tpl.tpz -d tpl && mv tpl/templates/* ~/.local/share/godot/export_templates/4.3.stable/
      - name: Android SDK
        run: |
          S=$HOME/asdk
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --sdk_root=$S --licenses >/dev/null || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --sdk_root=$S "cmdline-tools;latest" "platform-tools" "build-tools;34.0.0" "platforms;android-34" >/dev/null
          ls $S $S/cmdline-tools $S/cmdline-tools/latest/bin
      - name: Configurar editor
        run: |
          mkdir -p ~/.config/godot
          {
            echo '[gd_resource type="EditorSettings" format=3]'
            echo '[resource]'
            echo "export/android/android_sdk_path = \"$HOME/asdk\""
            echo "export/android/java_sdk_path = \"$JAVA_HOME\""
            echo "export/android/debug_keystore = \"$GITHUB_WORKSPACE/debug.keystore\""
            echo 'export/android/debug_keystore_user = "androiddebugkey"'
            echo 'export/android/debug_keystore_pass = "android"'
          } > ~/.config/godot/editor_settings-4.tres
      - name: Exportar APK
        run: |
          mkdir -p build
          ls ~/.local/share/godot/export_templates/4.3.stable | head -30
          ls ~/.config/godot; cat ~/.config/godot/editor_settings-4.tres; echo ANDROID_HOME=$ANDROID_HOME; ls $ANDROID_HOME $ANDROID_HOME/build-tools
          ./godot --headless --import || true
          ./godot --headless --verbose --export-debug "Android" build/aldea-ceniza.apk
          ls -la build
      - uses: actions/upload-artifact@v4
        with:
          name: aldea-ceniza-apk
          path: build/aldea-ceniza.apk
      - name: Huella de la firma
        run: $ANDROID_HOME/build-tools/34.0.0/apksigner verify --print-certs build/aldea-ceniza.apk | grep SHA-256
